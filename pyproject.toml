[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shelfsight-retail-compliance"
version = "0.2.0"
description = "Local research prototype for retail shelf region proposals, SKU classification, inventory facings, and planogram checks"
requires-python = ">=3.10,<3.13"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["shelfsight*", "training*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
